services:
  # Backend API
  - type: web
    name: autotask-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: autotask-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
    
  # Frontend Static Site
  - type: web
    name: autotask-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://autotask-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 616889383289-59ljvqin4boq7p3h04u4mlh3bsf5ol7p.apps.googleusercontent.com

databases:
  - name: autotask-db
    plan: free
    databaseName: autotask
    user: autotask
